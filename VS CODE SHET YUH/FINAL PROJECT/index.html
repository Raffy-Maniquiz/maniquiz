<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="theme-color" content="#f3f5f1">
	<title>walang PHONE bosseng? | Phone store</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="style.css">
	<script src="main.js" defer></script>
</head>
<body>
	<div class="app-shell">
		<aside class="sidebar">
			<a class="brand" aria-label="walang PHONE bosseng?">
				<span class="brand-mark">w</span>
				<span>walang PHONE bosseng?</span>
			</a>
			<div class="store-label">YOUR STORE</div>
			<nav class="side-nav" aria-label="Main navigation">
				<button class="nav-link active" type="button" data-view="overview"><span class="nav-icon">◫</span> Overview</button>
				<button class="nav-link" type="button" data-view="products"><span class="nav-icon">▧</span> Products</button>
				<button class="nav-link" type="button" data-view="orders"><span class="nav-icon">⌑</span> Orders <span class="nav-count" id="order-count">4</span></button>
				<button class="nav-link" type="button" data-view="customers"><span class="nav-icon">♙</span> Customers</button>
			</nav>
			<div class="sidebar-bottom">
				<div class="help-card">
					<span class="help-dot"></span>
					<div><strong>Need a hand?</strong><span>We're here for you.</span></div>
					<span class="help-arrow">↗</span>
				</div>
				<button class="profile-button" type="button">
					<span class="avatar">RM</span>
					<span class="profile-copy"><strong>Raffy Maniquiz</strong><small id="profile-role">Store admin</small></span>
					<span class="profile-more">···</span>
				</button>
			</div>
		</aside>

		<main class="main-content">
			<header class="topbar">
				<div class="breadcrumb"><span>walang PHONE bosseng?</span><span class="crumb-slash">/</span><strong id="page-crumb">Overview</strong></div>
				<div class="topbar-actions">
					<label class="role-picker"><span>Viewing as</span><select id="role-select" aria-label="Available roles"><option value="customer">Customer</option><option value="staff">Sales staff</option><option value="admin" selected>Admin</option></select></label>
					<button class="icon-button notification-button" type="button" aria-label="Notifications" title="Notifications">♧<i></i></button>
				</div>
			</header>
			<section id="view-root" aria-live="polite"></section>
		</main>
	</div>
	<dialog class="product-dialog" id="product-dialog">
		<div class="dialog-head"><div><span class="eyebrow">INVENTORY</span><h2>Add a product</h2></div><button class="icon-button close-dialog" type="button" aria-label="Close">×</button></div>
		<form id="product-form">
			<label>Product name<input name="name" required placeholder="e.g. iPhone 16"></label>
			<label>Category<select name="category"><option>iPhone</option><option>Android</option><option>Accessories</option></select></label>
			<div class="form-row"><label>Price (PHP)<input name="price" type="number" min="1" required></label><label>Quantity<input name="stock" type="number" min="0" required></label></div>
			<label>Details<input name="detail" placeholder="Storage · Color"></label>
			<button class="button button-primary dialog-submit" type="submit">Add to inventory <span>↗</span></button>
		</form>
	</dialog>
	<div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
